# configs/train/fast.yaml
batch_size: 4
num_epochs: 10
num_workers: 0   # 0 is safer on Mac for debugging
optimizer:
  type: adamw
  lr: 1e-4
  weight_decay: 1e-4
  betas: [0.9, 0.999]
scheduler:
  type: cosine_annealing
  T_max: 10
  eta_min: 1e-6
loss:
  chamfer_weight: 1.0
  smoothness_weight: 0.1
  magnitude_weight: 0.01
  attachment_weight: 1.0
checkpointing:
  save_every_n_epochs: 5
  keep_last_k: 3
  save_dir: checkpoints/