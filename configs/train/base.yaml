batch_size: 16
num_epochs: 200
num_workers: 4

optimizer:
  type: adamw
  lr: 1e-4
  weight_decay: 1e-4
  betas: [0.9, 0.999]

scheduler:
  type: cosine_annealing
  T_max: 200
  eta_min: 1e-6

loss:
  correspondence_weight: 1.0
  contrastive_weight: 0.1
  smoothness_weight: 0.05
  magnitude_weight: 0.001
  occluded_weight: 0.1
  temperature: 0.1
  validity_threshold: 0.15

checkpointing:
  save_every_n_epochs: 10
  keep_last_k: -1
  save_dir: checkpoints/
