# configs/train/base.yaml
batch_size: 16
num_epochs: 200
num_workers: 4

optimizer:
  type: adamw
  lr: 1e-4
  weight_decay: 1e-4
  betas: [0.9, 0.999]

scheduler:
  type: cosine_annealing
  T_max: 200
  eta_min: 1e-6

loss:
  # Chamfer distance between deformed canonical and observed
  chamfer_weight: 1.0
  # Regularization: deformation field should be smooth
  smoothness_weight: 0.1
  # Regularization: deformation magnitude (prevents collapse)
  magnitude_weight: 0.01
  # Virtual content attachment accuracy
  attachment_weight: 1.0

checkpointing:
  save_every_n_epochs: 10
  keep_last_k: -1
  save_dir: checkpoints/
