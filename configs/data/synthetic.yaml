name: synthetic

shapenet_root: /kaggle/working/ModelNet40 # update path as needed
cache_dir: /kaggle/working/modelnet_cache

generation:
  num_objects: 400
  deformations_per_object: 20
  deformation_magnitude_min: 0.0
  deformation_magnitude_max: 0.4
  noise_std: 0.005

pointcloud:
  num_points_canonical: 2048
  num_points_observed: 1024
  use_normals: true

split:
  train: 0.8
  val: 0.1
  test: 0.1

virtual_content:
  num_surface_points: 64
  num_interior_points: 0   # disabled for ShapeNet — complex meshes

visibility_threshold: 0.15
