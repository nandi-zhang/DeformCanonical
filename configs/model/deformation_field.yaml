name: deformation_field

encoder:
  type: pointnet_plus
  input_dim: 9    # xyz(3) + normals(3) + rgb(3) — xyz passed separately, feat=normals+rgb=6
  output_dim: 256
  hidden_dims: [64, 128, 256]

decoder:
  type: mlp
  latent_dim: 256
  hidden_dims: [256, 256, 256, 256]
  output_dim: 3
  use_positional_encoding: true
  positional_encoding_freqs: 6

canonical_encoder:
  type: pointnet_plus
  input_dim: 9
  output_dim: 256
  hidden_dims: [64, 128, 256]

fusion:
  type: cross_attention
  output_dim: 256
